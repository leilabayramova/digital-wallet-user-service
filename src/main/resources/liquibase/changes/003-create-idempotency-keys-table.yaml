databaseChangeLog:
  - changeSet:
      id: 003-create-idempotency-keys-table
      author: leila

      changes:
        - createTable:
            tableName: idempotency_keys
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_idempotency_keys
                    nullable: false

              - column:
                  name: idempotency_key
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: response_body
                  type: TEXT
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: idempotency_keys
            columnNames: idempotency_key
            constraintName: uq_idempotency_keys_key

      rollback:
        - dropTable:
            tableName: idempotency_keys
